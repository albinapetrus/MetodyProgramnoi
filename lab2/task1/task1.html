<!DOCTYPE html>
<html lang="uk">
    <head>
        <title>Laboratorna number two, task number  one </title>
        <meta charset="UTF-8">
        <script src="task1.js"></script>
        <link rel="stylesheet" href="task1.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        
<form class="form" oninput="validateForm()">
    <div>
        <label for="x0">Кордината початкової точки по осі x,(в м):</label>
        <input type="number" id="x0" name="x0" min="0" max="90" step="0.0001" required title="введіть значення від 0 до 300!"/>
    </div><br/>
    <div>
        <label for="y0">Кордината початкової точки по осі y,(в м):</label>
        <input type="number" id="y0" name="y0" min="0" max="300" step="0.0001" required title="введіть значення від 0 до 300!"/>
    </div><br/>
    <label for="v0">Початкова швидкість (в м/c):</label>
    <input type="number" id="v0" name="v0" min="0" max="1000" step="0.0001" required title="введіть значення від 0 до 1000!"/><br/>
    <label for="ang">Кут (в градусах):</label>
    <input type="number" id="ang" name="ang" min="0" max="90" step="0.0001" required title="введіть значення від 0 до 180!"/><br/>
        
    <label for="gr">Колір графіку:</label>
    <input type="color" id="gr" name="gr" title="виберіть колір" />
</div><br/>
<button type="button" onclick="plotTrajectory(); calculate1();">Побудувати траєкторію</button><br/>
<button type="button" onclick="clearCanvas()">Очистити</button>
</form>
<div id="outputtext"></div>

<div>
    <canvas id="myCanvas" width="650px" height="650px" style="border:1px dotted #942e2e;"></canvas>
    <div class="div"><var>x, м</var></div>
    <div class="div1"><var>y, м</var>
    </div>
    </body>
</html>
