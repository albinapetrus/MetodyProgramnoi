<!DOCTYPE html>
<html lang="uk">
    <head>
        <title>Laboratorna number two, task number  two </title>
        <meta charset="UTF-8">
        <script src="task2.js" ></script>
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <link rel="stylesheet" href="task2.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <form class="form" oninput="validateForm()">
            <div>
                <label for="x0">Кордината початкової точки по осі x,(в м):</label>
                <input type="number" id="x0" name="x0" min="-12" max="12" step="0.0001" required title="введіть значення від -12 до 12!"/>
            </div><br/>
            <div>
                <label for="y0">Кордината початкової точки по осі y,(в м):</label>
                <input type="number" id="y0" name="y0" min="-12" max="12" step="0.0001" required title="введіть значення від -12 до 12!"/>
            </div><br/>
            <label for="v0">Початкова швидкість (в м/c):</label>
            <input type="number" id="v0" name="v0" min="0" max="1000" step="0.0001" required title="введіть значення від 0 до 1000!"/><br/>
            <label for="ang">Кут (в градусах):</label>
            <input type="number" id="ang" name="ang" min="0" max="90" step="0.0001" required title="введіть значення від 0 до 90!"/><br/>
    <label for="gr">Колір графіку:</label>
    <input type="color" id="gr" name="gr" title="виберіть колір" />
</div><br/>
<button type="button" onclick="plotTrajectory()">Побудувати траєкторію</button><br/>
<button type="button" onclick="clearCanvas()">Очистити</button>
</form>

    
    <div id="graphContainer"></div>
    <div class="div"><var>x, м</var></div>
    <div class="div1"><var>y, м</var></div>
    
    </body>
</html>
